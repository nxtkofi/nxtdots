[Settings]
language = en
folder = ~/wallpaper
monitors = All
show_path_in_tooltip = True
backend = swww
fill = fill
sort = name
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = $HOME/.config/scripts/bin/main update-wallpaper $wallpaper
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
use_xdg_state = False
stylesheet = ~/.config/waypaper/style.css
