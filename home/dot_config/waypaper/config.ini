[Settings]
language = en
folder = ~/wallpaper
monitors = All
show_path_in_tooltip = True
backend = awww
fill = fill
sort = name
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = $HOME/.config/scripts/bin/main update-wallpaper $wallpaper
number_of_columns = 3
use_xdg_state = False
stylesheet = ~/.config/waypaper/style.css
