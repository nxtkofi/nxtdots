# ====================================
# TMUX Configuration - nxtdots
# ====================================

# Change prefix from C-b to C-a (similar to GNU Screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable focus events for better vim/neovim integration
set -g focus-events on

# Allow passthrough sequences (for neovim and other modern terminal apps)
set -g allow-passthrough on

# Extended keys - allows modifiers like Ctrl+Shift, Ctrl+. etc
set -g extended-keys on
set -g xterm-keys on
set -as terminal-features ',xterm-kitty:extkeys'

# Set escape time to 0 for faster command sequences
set -sg escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Display tmux messages for 3 seconds
set -g display-time 3000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Start window and pane numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set terminal title
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# ====================================
# Key Bindings
# ====================================

# Reload the chezmoi-managed config (not the legacy ~/.tmux.conf).
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes using vim-style navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Enable vi mode in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ====================================
# Catppuccin Mocha
# ====================================

set -g status-position top
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# Keep Catppuccin's mantle value for rounded separators, then make only the
# unoccupied portion of the status line transparent after the theme loads.
set -g @catppuccin_status_background 'default'
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'
set -gF status-style 'bg=default fg=#{@thm_fg}'

# Theme modules must be configured after Catppuccin is loaded.
set -g status-left ''
set -g status-right-length 120
set -g status-right '#{E:@catppuccin_status_directory}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

# Window activity
setw -g monitor-activity on
set -g visual-activity off

