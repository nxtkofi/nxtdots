# ====================================
# TMUX Configuration - nxtdots
# ====================================

# Change prefix from C-b to C-a (similar to GNU Screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable focus events for better vim/neovim integration
set -g focus-events on

# Allow passthrough sequences (for neovim and other modern terminal apps)
set -g allow-passthrough on

# Extended keys - allows modifiers like Ctrl+Shift, Ctrl+. etc
set -g extended-keys on
set -g xterm-keys on
set -as terminal-features ',xterm-kitty:extkeys'

# Set escape time to 0 for faster command sequences
set -sg escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Display tmux messages for 3 seconds
set -g display-time 3000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Start window and pane numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set terminal title
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# ====================================
# Key Bindings
# ====================================

# Reload the chezmoi-managed config (not the legacy ~/.tmux.conf).
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes using vim-style navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Enable vi mode in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ====================================
# Status Bar Configuration
# ====================================

# Status bar position
set -g status-position bottom

# Transparent status-bar background; keep the existing foreground colour.
set -g status-style 'bg=default fg=#cdd6f4'

# Left status
set -g status-left-length 40
set -g status-left '#[fg=#89b4fa,bold] #S #[fg=#cdd6f4]| '

# Right status
set -g status-right-length 80
set -g status-right '#[fg=#cdd6f4]%H:%M #[fg=#89b4fa]| #[fg=#cdd6f4]%d-%b-%y '

# Window status
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=#89b4fa,bold] #I:#W '

# Window activity
setw -g monitor-activity on
set -g visual-activity off

# Pane border colors
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Message colors
set -g message-style 'fg=#cdd6f4 bg=#313244'
set -g message-command-style 'fg=#cdd6f4 bg=#313244'

# ====================================
# Plugins (optional - install TPM)
# ====================================
